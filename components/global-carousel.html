<!--
  Component: Global Presence Carousel
  Usage: Dark section with horizontal scrollable card carousel
  Slots: eyebrow, title, cards
  CSS: .global-section, .global-carousel, .global-card
  JS: GlobalCarousel class in js/main.js
-->
<section class="global-section">
  <div class="container">
    <span class="section-eyebrow anim-fade-up"><!-- Slot: eyebrow --></span>
    <h2 class="anim-fade-up"><!-- Slot: title --></h2>
    <div class="global-carousel" id="globalCarouselNew">
      <div class="global-carousel-track" id="globalCarouselTrack">
        <!-- Slot: global cards -->
        <div class="global-card">
          <div class="global-card-image" style="background-image:linear-gradient(135deg,#1a3a5c,#0d1f3a);"></div>
          <div class="global-card-body">
            <h3><!-- Slot: location --></h3>
            <p><!-- Slot: description --></p>
            <span class="global-link">Read more →</span>
          </div>
        </div>
      </div>
      <div class="global-carousel-controls">
        <button class="global-carousel-btn" id="globalPrev" disabled>‹</button>
        <button class="global-carousel-btn" id="globalNext">›</button>
      </div>
    </div>
  </div>
</section>
