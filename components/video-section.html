<!--
  Component: Video Section (Broadcast style)
  Usage: Full-width dark section with video thumbnail + play button
  Slots: eyebrow, title, thumbnail image
  CSS: .video-section, .video-thumbnail, .video-play-btn
-->
<section class="video-section">
  <div class="container">
    <span class="section-eyebrow anim-fade-up"><!-- Slot: eyebrow --></span>
    <h2 class="anim-fade-up"><!-- Slot: title --></h2>
    <div class="video-thumbnail anim-scale-in">
      <!-- Slot: thumbnail -->
      <div class="video-play-btn"></div>
    </div>
  </div>
</section>
