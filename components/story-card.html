<!--
  Component: Story Card (Enterprise-style)
  Usage: 2-column grid with image + content
  Slots: image, date, title, description, link
  CSS: .story-card, .story-card-image, .story-card-content
-->
<div class="story-card anim-fade-up">
  <div class="story-card-image">
    <!-- Slot: image or gradient placeholder -->
  </div>
  <div class="story-card-content">
    <span class="story-date"><!-- Slot: date --></span>
    <h2><!-- Slot: title --></h2>
    <p><!-- Slot: description --></p>
    <a href="#" class="btn-link"><!-- Slot: link text --> <span class="arrow">→</span></a>
  </div>
</div>
