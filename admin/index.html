<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Manager | Fatec System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; }
    .cms-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #10069F;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="nc-root"></div>
  <div id="cms-loading" class="cms-loading">
    Loading Content Manager...
  </div>
  <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
  <script>
    // Hide loading indicator once CMS is ready
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        var loading = document.getElementById("cms-loading");
        if (loading) loading.style.display = "none";
      });
    }
    // Also hide on DOMContentLoaded as fallback
    window.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        var loading = document.getElementById("cms-loading");
        if (loading && document.getElementById("nc-root").children.length > 0) {
          loading.style.display = "none";
        }
      }, 2000);
    });
  </script>
</body>
</html>
