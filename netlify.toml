[build]
  command = "node build.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/blog/*"
  to = "/blog/"
  status = 200

[[redirects]]
  from = "/calculator"
  to = "/calculator/"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 200